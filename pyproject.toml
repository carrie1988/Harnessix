[project]
name = "harnessix"
version = "0.1.0"
description = "面向生产级 Coding Agent 的本地优先运行时与安全执行基础设施"
readme = "README.md"
requires-python = ">=3.12"
license = { file = "LICENSE" }
authors = [{ name = "Harnessix Contributors" }]
dependencies = [
    "aiosqlite>=0.21,<1",
    "asyncpg>=0.30,<1",
    "fastapi>=0.116,<1",
    "httpx>=0.28,<1",
    "pydantic>=2.11,<3",
    "uvicorn>=0.35,<1",
]

[project.optional-dependencies]
langgraph = ["langchain-core>=1.0,<2"]
observability = [
    "opentelemetry-api>=1.30,<2",
    "opentelemetry-exporter-otlp-proto-http>=1.30,<2",
    "opentelemetry-sdk>=1.30,<2",
]

[dependency-groups]
dev = [
    "mypy>=1.17,<2",
    "pytest>=8.4,<9",
    "pytest-asyncio>=1.1,<2",
    "ruff>=0.12,<1",
]

[project.scripts]
harnessix = "harnessix.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/harnessix"]

[tool.pytest.ini_options]
addopts = "-q"
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["ASYNC", "B", "E", "F", "I", "UP"]

[tool.mypy]
python_version = "3.12"
strict = true
packages = ["harnessix"]

[[tool.mypy.overrides]]
module = ["aiosqlite.*", "asyncpg.*", "langchain_core.*"]
ignore_missing_imports = true
