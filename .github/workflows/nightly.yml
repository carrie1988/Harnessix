name: Nightly

# 每次推送的CI跳过标记为nightly的用例（单项耗时数分钟的容量用例），这里每天在main上补跑。
on:
  schedule:
    - cron: "0 18 * * *"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  slow-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@1af3b93b6815bc44a9784bd300feb67ff0d1eeb3 # v6.0.0
        with:
          fetch-depth: 0
      - uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          python-version: "3.12"
      - run: uv sync --locked --all-extras --dev
      - run: uv run pytest -n auto --durations=20 -m nightly --ignore=tests/governance --basetemp="$RUNNER_TEMP/pytest"
