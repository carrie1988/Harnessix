name: 最低SHA256commit单次原生诊断

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  minimum-commit-probe:
    runs-on: windows-latest
    env:
      HARNESSIX_GIT_NATIVE_DIFFERENTIAL: '1'
    steps:
      - name: 拒绝当前Run重跑
        shell: pwsh
        run: |
          if ($env:GITHUB_RUN_ATTEMPT -ne '1') {
            Write-Host 'minimum_commit_probe_attempt_refused'
            exit 2
          }
      - uses: actions/checkout@1af3b93b6815bc44a9784bd300feb67ff0d1eeb3 # v6.0.0
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          python-version: "3.12"
      - run: uv sync --locked --all-extras --dev
      - name: 原官方Git身份仅预检
        id: preflight
        shell: pwsh
        timeout-minutes: 5
        run: |
          $env:PYTHONPATH = Join-Path $env:GITHUB_WORKSPACE 'src'
          $suffix = $env:GITHUB_RUN_ID + '-' + $env:GITHUB_RUN_ATTEMPT
          $private = Join-Path $env:RUNNER_TEMP ('git-minimum-identity-' + $suffix)
          $report = Join-Path $env:RUNNER_TEMP ('git-minimum-identity-report-' + $suffix)
          uv run python -m scripts.windows_git_native_branch_observation.observe --output $private --report $report
          exit $LASTEXITCODE
      - name: 无写无namespace持有 hash-direct
        if: ${{ !cancelled() && steps.preflight.conclusion == 'success' }}
        shell: pwsh
        timeout-minutes: 1
        env:
          HARNESSIX_GIT_NATIVE_DIFFERENTIAL_SYMBOLS: ${{ runner.temp }}/git-minimum-identity-${{ github.run_id }}-${{ github.run_attempt }}/symbols
        run: |
          $base = Join-Path $env:RUNNER_TEMP ('minimum-hash-direct-' + $env:GITHUB_RUN_ID + '-' + $env:GITHUB_RUN_ATTEMPT)
          if (Test-Path -LiteralPath $base -ErrorAction Stop) { exit 2 }
          uv run pytest -q --tb=no -rN --show-capture=no --disable-warnings --no-header `
            --basetemp $base `
            'tests/product_config/test_git_material_snapshot_differential.py::test_real_snapshot_hash_and_write[hash-direct]'
          exit $LASTEXITCODE
      - name: 无写原namespace持有 hash-held
        if: ${{ !cancelled() && steps.preflight.conclusion == 'success' }}
        shell: pwsh
        timeout-minutes: 1
        env:
          HARNESSIX_GIT_NATIVE_DIFFERENTIAL_SYMBOLS: ${{ runner.temp }}/git-minimum-identity-${{ github.run_id }}-${{ github.run_attempt }}/symbols
        run: |
          $base = Join-Path $env:RUNNER_TEMP ('minimum-hash-held-' + $env:GITHUB_RUN_ID + '-' + $env:GITHUB_RUN_ATTEMPT)
          if (Test-Path -LiteralPath $base -ErrorAction Stop) { exit 2 }
          uv run pytest -q --tb=no -rN --show-capture=no --disable-warnings --no-header `
            --basetemp $base `
            'tests/product_config/test_git_material_snapshot_differential.py::test_real_snapshot_hash_and_write[hash-held]'
          exit $LASTEXITCODE
      - name: 写入无namespace持有 write-direct
        if: ${{ !cancelled() && steps.preflight.conclusion == 'success' }}
        shell: pwsh
        timeout-minutes: 1
        env:
          HARNESSIX_GIT_NATIVE_DIFFERENTIAL_SYMBOLS: ${{ runner.temp }}/git-minimum-identity-${{ github.run_id }}-${{ github.run_attempt }}/symbols
        run: |
          $base = Join-Path $env:RUNNER_TEMP ('minimum-write-direct-' + $env:GITHUB_RUN_ID + '-' + $env:GITHUB_RUN_ATTEMPT)
          if (Test-Path -LiteralPath $base -ErrorAction Stop) { exit 2 }
          uv run pytest -q --tb=no -rN --show-capture=no --disable-warnings --no-header `
            --basetemp $base `
            'tests/product_config/test_git_material_snapshot_differential.py::test_real_snapshot_hash_and_write[write-direct]'
          exit $LASTEXITCODE
      - name: 写入原namespace持有 write-held
        if: ${{ !cancelled() && steps.preflight.conclusion == 'success' }}
        shell: pwsh
        timeout-minutes: 1
        env:
          HARNESSIX_GIT_NATIVE_DIFFERENTIAL_SYMBOLS: ${{ runner.temp }}/git-minimum-identity-${{ github.run_id }}-${{ github.run_attempt }}/symbols
        run: |
          $base = Join-Path $env:RUNNER_TEMP ('minimum-write-held-' + $env:GITHUB_RUN_ID + '-' + $env:GITHUB_RUN_ATTEMPT)
          if (Test-Path -LiteralPath $base -ErrorAction Stop) { exit 2 }
          uv run pytest -q --tb=no -rN --show-capture=no --disable-warnings --no-header `
            --basetemp $base `
            'tests/product_config/test_git_material_snapshot_differential.py::test_real_snapshot_hash_and_write[write-held]'
          exit $LASTEXITCODE
      - name: 同源fanout单目录持有
        if: ${{ !cancelled() && steps.preflight.conclusion == 'success' }}
        shell: pwsh
        timeout-minutes: 2
        env:
          HARNESSIX_GIT_NATIVE_DIFFERENTIAL_SYMBOLS: ${{ runner.temp }}/git-minimum-identity-${{ github.run_id }}-${{ github.run_attempt }}/symbols
        run: |
          $base = Join-Path $env:RUNNER_TEMP ('minimum-single-fanout-' + $env:GITHUB_RUN_ID + '-' + $env:GITHUB_RUN_ATTEMPT)
          if (Test-Path -LiteralPath $base -ErrorAction Stop) { exit 2 }
          uv run pytest -q --tb=no -rN --show-capture=no --disable-warnings --no-header `
            --basetemp $base `
            'tests/product_config/test_git_material_snapshot_differential.py::test_same_seed_repository_with_single_hold[fanout]'
          exit $LASTEXITCODE
      - name: 同源blob单文件持有
        if: ${{ !cancelled() && steps.preflight.conclusion == 'success' }}
        shell: pwsh
        timeout-minutes: 2
        env:
          HARNESSIX_GIT_NATIVE_DIFFERENTIAL_SYMBOLS: ${{ runner.temp }}/git-minimum-identity-${{ github.run_id }}-${{ github.run_attempt }}/symbols
        run: |
          $base = Join-Path $env:RUNNER_TEMP ('minimum-single-blob-' + $env:GITHUB_RUN_ID + '-' + $env:GITHUB_RUN_ATTEMPT)
          if (Test-Path -LiteralPath $base -ErrorAction Stop) { exit 2 }
          uv run pytest -q --tb=no -rN --show-capture=no --disable-warnings --no-header `
            --basetemp $base `
            'tests/product_config/test_git_material_snapshot_differential.py::test_same_seed_repository_with_single_hold[blob]'
          exit $LASTEXITCODE
      - name: 真实Win32子文件创建
        if: ${{ !cancelled() && steps.preflight.conclusion == 'success' }}
        shell: pwsh
        timeout-minutes: 1
        env:
          HARNESSIX_GIT_NATIVE_DIFFERENTIAL_SYMBOLS: ${{ runner.temp }}/git-minimum-identity-${{ github.run_id }}-${{ github.run_attempt }}/symbols
        run: |
          $base = Join-Path $env:RUNNER_TEMP ('minimum-child-create-' + $env:GITHUB_RUN_ID + '-' + $env:GITHUB_RUN_ATTEMPT)
          if (Test-Path -LiteralPath $base -ErrorAction Stop) { exit 2 }
          uv run pytest -q --tb=no -rN --show-capture=no --disable-warnings --no-header `
            --basetemp $base `
            'tests/product_config/test_git_material_snapshot_differential.py::test_real_windows_child_operation_under_fanout_hold[create]'
          exit $LASTEXITCODE
      - name: 真实Win32硬链接
        if: ${{ !cancelled() && steps.preflight.conclusion == 'success' }}
        shell: pwsh
        timeout-minutes: 1
        env:
          HARNESSIX_GIT_NATIVE_DIFFERENTIAL_SYMBOLS: ${{ runner.temp }}/git-minimum-identity-${{ github.run_id }}-${{ github.run_attempt }}/symbols
        run: |
          $base = Join-Path $env:RUNNER_TEMP ('minimum-child-link-' + $env:GITHUB_RUN_ID + '-' + $env:GITHUB_RUN_ATTEMPT)
          if (Test-Path -LiteralPath $base -ErrorAction Stop) { exit 2 }
          uv run pytest -q --tb=no -rN --show-capture=no --disable-warnings --no-header `
            --basetemp $base `
            'tests/product_config/test_git_material_snapshot_differential.py::test_real_windows_child_operation_under_fanout_hold[link]'
          exit $LASTEXITCODE
      - name: 原目录共享拒绝与仅补写共享的真实链接反例
        if: ${{ !cancelled() && steps.preflight.conclusion == 'success' }}
        shell: pwsh
        timeout-minutes: 1
        env:
          HARNESSIX_GIT_NATIVE_DIFFERENTIAL_SYMBOLS: ${{ runner.temp }}/git-minimum-identity-${{ github.run_id }}-${{ github.run_attempt }}/symbols
        run: |
          $base = Join-Path $env:RUNNER_TEMP ('minimum-link-sharing-' + $env:GITHUB_RUN_ID + '-' + $env:GITHUB_RUN_ATTEMPT)
          if (Test-Path -LiteralPath $base -ErrorAction Stop) { exit 2 }
          uv run pytest -q --tb=no -rN --show-capture=no --disable-warnings --no-header `
            --basetemp $base `
            'tests/product_config/test_git_material_snapshot_differential.py::test_real_windows_link_sharing_counterfactual'
          exit $LASTEXITCODE
      - name: 原Windows文件写入及文件目录改名删除保护
        if: ${{ !cancelled() && steps.preflight.conclusion == 'success' }}
        shell: pwsh
        timeout-minutes: 1
        run: |
          $base = Join-Path $env:RUNNER_TEMP ('minimum-original-hold-protection-' + $env:GITHUB_RUN_ID + '-' + $env:GITHUB_RUN_ATTEMPT)
          if (Test-Path -LiteralPath $base -ErrorAction Stop) { exit 2 }
          uv run pytest -q --tb=no -rN --show-capture=no --disable-warnings --no-header `
            --basetemp $base `
            'tests/product_config/test_git_material_native.py::test_windows_data_read_guard_rejects_write_rename_delete_with_metadata_control'
          exit $LASTEXITCODE
      - name: 原两个案例及低敏只读侧车
        if: ${{ !cancelled() && steps.preflight.conclusion == 'success' }}
        shell: pwsh
        timeout-minutes: 5
        run: |
          $base = Join-Path $env:RUNNER_TEMP ('minimum-commit-' + $env:GITHUB_RUN_ID + '-' + $env:GITHUB_RUN_ATTEMPT)
          try {
            $exists = Test-Path -LiteralPath $base -ErrorAction Stop
          } catch {
            Write-Host 'minimum_commit_probe_fixture_unavailable'
            exit 2
          }
          if ($exists) {
            Write-Host 'minimum_commit_probe_fixture_preexists'
            exit 2
          }
          uv run pytest -p tests.product_config.git_minimum_commit_probe `
            -q -s --tb=no -rN --show-capture=no --disable-warnings --no-header `
            --basetemp $base `
            --git-material-trace2=stderr-event-v1 `
            'tests/product_config/test_git_material_input.py::test_real_complete_input_and_independently_approved_readback[empty-or-valid-minimum-commit-sha256]' `
            'tests/product_config/test_git_material_cas_integration.py::test_complete_cas_material_original_owner_and_independent_readback[legal-minimum-commit-sha256]'
          exit $LASTEXITCODE
