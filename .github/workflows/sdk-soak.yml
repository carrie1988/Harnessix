name: SDK容量正式Soak

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  sdk-capacity:
    name: SDK容量 ${{ matrix.platform }}
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: linux
            runner: ubuntu-latest
          - platform: macos
            runner: macos-latest
          - platform: windows
            runner: windows-latest
    env:
      SOAK_EVIDENCE_ROOT: ${{ runner.temp }}/harnessix-sdk-soak-evidence
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          python-version: "3.12"
      - run: uv sync --locked --all-extras --dev
      - name: 运行固定正式负载并独立重读Run与Attempt
        run: uv run python -m scripts.run_sdk_soak_release --evidence-root "$SOAK_EVIDENCE_ROOT"
        shell: bash
      - name: 保留已提交Run或失败Attempt
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: harnessix-sdk-soak-${{ matrix.platform }}-${{ github.sha }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ env.SOAK_EVIDENCE_ROOT }}
          if-no-files-found: ignore
          retention-days: 14
