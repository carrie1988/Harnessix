name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  python:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.12", "3.13"]
    steps:
      - uses: actions/checkout@v6
      - uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          python-version: ${{ matrix.python-version }}
      - run: uv sync --locked --all-extras --dev
      - run: uv run ruff format --check .
      - run: uv run ruff check .
      - run: uv run mypy src
      - run: uv run pytest
      - run: uv run python -m examples.kernel_search
      - run: uv run python -m examples.kernel_artifacts

  coding-tools-macos:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v6
      - uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          python-version: "3.12"
      - run: uv sync --locked --all-extras --dev
      - run: uv run pytest tests/tools tests/artifacts
      - run: uv run python -m examples.kernel_files
      - run: uv run python -m examples.kernel_search
      - run: uv run python -m examples.kernel_artifacts

  postgres:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_DB: harnessix_test
          POSTGRES_USER: harnessix
          POSTGRES_PASSWORD: harnessix
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U harnessix -d harnessix_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      HARNESSIX_TEST_POSTGRES_URL: postgresql://harnessix:harnessix@127.0.0.1:5432/harnessix_test
    steps:
      - uses: actions/checkout@v6
      - uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          python-version: "3.12"
      - run: uv sync --locked --all-extras --dev
      - run: uv run pytest tests/integration/test_postgres_journal.py
