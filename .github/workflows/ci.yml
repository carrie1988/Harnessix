name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  python:
    runs-on: ubuntu-latest
    strategy:
      # 独立矩阵完整产出功能反馈，不因另一矩阵末尾的发行治理失败而中止。
      fail-fast: false
      matrix:
        python-version: ["3.12", "3.13"]
    steps:
      - uses: actions/checkout@1af3b93b6815bc44a9784bd300feb67ff0d1eeb3 # v6.0.0
        with:
          fetch-depth: 0
      - uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          python-version: ${{ matrix.python-version }}
      - run: uv sync --locked --all-extras --dev
      - run: uv run python scripts/readability_report.py --check --check-final-report --quiet
      - run: uv run python scripts/documentation_check.py
      - run: uv run python scripts/generate_specs.py --check
      - run: uv run python scripts/secret_scan.py --self-check
      - run: uv build --offline --out-dir dist/secret-gate
        timeout-minutes: 2
      - run: uv run python scripts/secret_scan.py --artifact-dir dist/secret-gate
        timeout-minutes: 2
      - run: uv run ruff format --check .
      - run: uv run ruff check .
      - run: uv run mypy src
      - run: uv run pytest
      - run: uv run python -m examples.kernel_search
      - run: uv run python -m examples.kernel_artifacts
      - run: uv run python -m examples.patch_plan
      - run: uv run python -m examples.managed_patch
      - run: uv run python -m examples.patch_bridge
      - run: uv run python -m examples.kernel_patch
      - run: uv run python -m examples.patch_batch
      - run: uv run python -m examples.managed_batch_approval
      - run: uv run python -m examples.managed_batch
      - run: uv run python -m examples.batch_patch_bridge
      - run: uv run python -m examples.kernel_batch
      - run: uv run python -m examples.batch_diff
      - run: uv run python -m examples.host_process
      # 功能验证先产出结果；发行治理仍为失败关闭门禁，不阻挡前序功能反馈。
      - run: uv run python scripts/license_scan.py --check
      - run: uv run python scripts/sbom_generate.py --check

  coding-tools-macos:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@1af3b93b6815bc44a9784bd300feb67ff0d1eeb3 # v6.0.0
        with:
          fetch-depth: 0
      - uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          python-version: "3.12"
      - run: uv sync --locked --all-extras --dev
      - run: uv run python scripts/readability_report.py --check --check-final-report --quiet
      - run: uv run python scripts/documentation_check.py
      - run: uv run python scripts/generate_specs.py --check
      - run: uv run pytest tests/governance/test_secret_scan.py tests/governance/test_cli_console.py
      - run: uv build --offline --out-dir dist/secret-gate
        timeout-minutes: 2
      - run: uv run python scripts/secret_scan.py --artifact-dir dist/secret-gate
        timeout-minutes: 2
      - run: uv run pytest tests/session tests/agent/test_authenticated_store.py
      - run: uv run pytest tests/benchmarks
      - run: uv run pytest tests/tools tests/artifacts tests/patches tests/processes tests/evals tests/context tests/execution tests/workspace tests/sandbox tests/secrets tests/delivery tests/trusted_actions tests/mcp tests/skills tests/hooks tests/product_config tests/product_ui
      - run: uv run python -m examples.kernel_files
      - run: uv run python -m examples.kernel_search
      - run: uv run python -m examples.kernel_artifacts
      - run: uv run python -m examples.patch_plan
      - run: uv run python -m examples.managed_patch
      - run: uv run python -m examples.patch_bridge
      - run: uv run python -m examples.kernel_patch
      - run: uv run python -m examples.patch_batch
      - run: uv run python -m examples.managed_batch_approval
      - run: uv run python -m examples.managed_batch
      - run: uv run python -m examples.batch_patch_bridge
      - run: uv run python -m examples.kernel_batch
      - run: uv run python -m examples.batch_diff
      - run: uv run python -m examples.host_process

  windows-trusted-execution:
    # Windows运行Workspace、Job Object Process、Sandbox/Secret与受管Git交付契约。
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@1af3b93b6815bc44a9784bd300feb67ff0d1eeb3 # v6.0.0
        with:
          fetch-depth: 0
      - uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          python-version: "3.12"
      - run: uv sync --locked --all-extras --dev
      - name: 验证原生NTFS文件事务与审批编码写链
        run: >-
          uv run pytest tests/delivery/test_windows_filesystem.py
          tests/delivery/test_windows_io_contracts.py
          tests/delivery/test_trusted_action_patch.py
          tests/product_config/test_server_and_cli.py::test_product_server_sdk_approves_review_and_applies_workspace_patch
        timeout-minutes: 3
      - name: 验证原生Git读取与取消回收
        run: >-
          uv run pytest tests/tools/test_windows_git.py
          tests/tools/test_git_platform_contracts.py
          tests/processes/test_windows_owner_lifecycle.py
          tests/processes/test_output_binary_contracts.py
          tests/processes/test_windows_receipt_contracts.py
          tests/processes/test_windows_supervisor.py::test_windows_fast_exit_keeps_verified_job_and_original_status
          tests/product_config/test_preflight.py::test_windows_doctor_accepts_native_git_without_creating_process_state
          tests/product_config/test_product_backup_files_windows.py
          tests/product_config/test_session_key_windows.py
          tests/workspace/test_windows_private_security_contracts.py
          tests/product_config/test_server_and_cli.py::test_windows_product_sdk_git_diff_uses_private_redacted_owner
          -vv -o faulthandler_timeout=60
        timeout-minutes: 3
      - name: 验证原生产品重启与State创建边界
        run: >-
          uv run pytest tests/benchmarks/test_soak_restart_child.py
          tests/benchmarks/test_soak_restart.py -vv -o faulthandler_timeout=60
        timeout-minutes: 3
      - name: 验证原生完整业务状态备份与恢复
        run: >-
          uv run pytest tests/product_config/test_product_state_backup.py
          tests/product_config/test_product_state_restore.py
          tests/product_config/test_windows_metadata_contracts.py
          -vv -o faulthandler_timeout=60
        timeout-minutes: 5
      - run: uv run python scripts/readability_report.py --check --check-final-report --quiet
      - run: uv run python scripts/documentation_check.py
      - run: uv run python -c "import harnessix"
      - run: uv build --offline --out-dir dist/secret-gate
        timeout-minutes: 2
      - run: uv run python scripts/secret_scan.py --artifact-dir dist/secret-gate
        timeout-minutes: 2
      - run: uv run pytest tests/session tests/agent/test_authenticated_store.py
      - run: uv run pytest tests/benchmarks
      - run: uv run pytest tests/governance tests/unit tests/execution tests/workspace tests/sandbox tests/secrets tests/delivery tests/trusted_actions tests/mcp tests/skills tests/hooks tests/product_config tests/product_ui tests/tools/test_windows_native_runtime.py tests/processes/test_supervision_contracts.py tests/processes/test_supervision_store.py tests/processes/test_windows_input.py tests/processes/test_windows_supervisor.py -o faulthandler_timeout=120
        timeout-minutes: 30

  container-sandbox:
    runs-on: ubuntu-latest
    env:
      HARNESSIX_TEST_CONTAINER_IMAGE: busybox@sha256:9db7b59979c38555a39def84a31fb98b5296952f9e3afd4f6f11f05b07adfab0
      HARNESSIX_TEST_NODE_IMAGE: node@sha256:1b2479dd35a99687d6638f5976fd235e26c5b37e8122f786fcd5fe231d63de5b
      HARNESSIX_TEST_PYTHON_IMAGE: python@sha256:efcdfa6a6b2fd2afb9c7dfa9a5b288a6f68338b5cfdebe6b637d986067d85757
    steps:
      - uses: actions/checkout@1af3b93b6815bc44a9784bd300feb67ff0d1eeb3 # v6.0.0
        with:
          fetch-depth: 0
      - uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          python-version: "3.12"
      - run: uv sync --locked --all-extras --dev
      - run: |
          docker pull "$HARNESSIX_TEST_CONTAINER_IMAGE"
          docker pull "$HARNESSIX_TEST_NODE_IMAGE"
          docker pull "$HARNESSIX_TEST_PYTHON_IMAGE"
      - run: >-
          uv run pytest
          tests/integration/test_container_sandbox.py
          tests/integration/test_product_process_profile.py
          tests/integration/test_task_pack_profiles.py
          tests/integration/test_task_pack_execution.py
      - name: 运行20 Trial完整离线Suite
        run: >-
          uv run python scripts/run_engineering_offline_suite.py
          --work-root "${RUNNER_TEMP}/harnessix-offline-suite-work"
          --evidence-root "${RUNNER_TEMP}/harnessix-offline-suite-evidence"
      - name: 上传脱敏离线Suite证据
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: harnessix-engineering-offline-suite-${{ github.sha }}
          path: ${{ runner.temp }}/harnessix-offline-suite-evidence
          if-no-files-found: error
          retention-days: 14

  documentation:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@1af3b93b6815bc44a9784bd300feb67ff0d1eeb3 # v6.0.0
        with:
          fetch-depth: 0
      - uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          python-version: "3.12"
      - run: uv sync --locked --all-extras --dev
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: "22"
      - run: npm install --global @mermaid-js/mermaid-cli@11.6.0
      - run: |
          chrome_path="$(command -v google-chrome)"
          test -x "$chrome_path"
          echo "PUPPETEER_EXECUTABLE_PATH=$chrome_path" >> "$GITHUB_ENV"
      - run: uv run python scripts/documentation_check.py --changed-from "$DOCS_BASE_REF" --render-mermaid
        env:
          DOCS_BASE_REF: ${{ github.event_name == 'pull_request' && github.event.pull_request.base.sha || github.event.before }}
